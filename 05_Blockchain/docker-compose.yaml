services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  authority:
    build:
      context: .
      dockerfile: authority/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      CHAIN_DB: iot_chain
      AUTHORITY_ID: poa-1
      BLOCK_INTERVAL_MS: 60000
      MAX_TX_PER_BLOCK: 500

      AUTHORITY_PRIV_PATH: /keys/authority_private.pem
      AUTHORITY_PUB_PATH: /keys/authority_public.pem

      MQTT_URL: mqtt://192.168.0.102:1883
      MQTT_TOPICS: eclss/temperature,eclss/humidite,eclss/pression,eclss/airquality

      HMAC_KEY: "HGL51xcaM7q43f3dq84fqDQF2ds54f3f43"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      - mongo

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data

  nodered:
    image: nodered/node-red:latest
    hostname: nodered
    build:
      context: ../03_Cloud_Dashboard
    ports:
      - "1880:1880"
    environment:
      - FLOWS=flows.json
    volumes:
      - ../03_Cloud_Dashboard/flows.json:/data/flows.json
    depends_on:
      - mongo
      - mosquitto

volumes:
  mongo_data:
  mosquitto_data: